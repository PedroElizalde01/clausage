<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Clausage GNOME indicator preview</title>
  <desc id="desc">A top bar showing 50 percent and a dark console-style usage menu.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="720" height="430" rx="18" fill="#28272f"/>
  <rect width="720" height="44" rx="18" fill="#17161c"/>
  <rect y="25" width="720" height="19" fill="#17161c"/>
  <text x="22" y="28" fill="#c8c5ce" font-family="sans-serif" font-size="14">Activities</text>
  <g transform="translate(620 22)">
    <circle r="9" fill="none" stroke="#6d6b73" stroke-width="3"/>
    <path d="M0-9 A9 9 0 1 1 0 9" fill="none" stroke="#eac236" stroke-width="3" stroke-linecap="round"/>
    <text x="17" y="5" fill="#f2f0f5" font-family="sans-serif" font-size="15" font-weight="600">50%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="270" y="58" width="420" height="326" rx="12" fill="#1d1c22" stroke="#4b4953"/>
    <rect x="270" y="58" width="420" height="6" rx="3" fill="#4bd18b"/>
  </g>
  <g fill="#e8e5ed" font-family="DejaVu Sans Mono, monospace" font-size="17">
    <text x="304" y="108" fill="#a9a5b0" font-size="15" letter-spacing="2">CLAUDE / USAGE</text>
    <text x="304" y="143" fill="#5f5c67">--------------------------</text>
    <text x="304" y="185">5H: [<tspan fill="#4bd18b">██████████</tspan><tspan fill="#686570">░░░░░░░</tspan> 50%]</text>
    <text x="304" y="225" fill="#a9a5b0">Resets in: <tspan fill="#e8e5ed">02h 18m</tspan></text>
    <text x="304" y="265">7D: [<tspan fill="#4bd18b">██████</tspan><tspan fill="#686570">░░░░░░░░░░░</tspan> 31%]</text>
    <text x="304" y="302" fill="#5f5c67">--------------------------</text>
    <text x="304" y="342" fill="#a9a5b0">STATUS  <tspan fill="#4bd18b">LIVE</tspan></text>
    <text x="304" y="372" fill="#e8e5ed">[ REFRESH NOW ]</text>
  </g>
</svg>
