name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v
      - run: node --check extension.js
      - run: node test_extension.js
      - run: zip -j clausage@pedroelizalde01.github.com.shell-extension.zip extension.js usage.py metadata.json
      - run: zip -j clausage-windows.zip tray.py usage.py _setup_startup.py install_windows.bat uninstall_windows.bat requirements.txt README.md LICENSE
      - run: gh release create "$GITHUB_REF_NAME" clausage@pedroelizalde01.github.com.shell-extension.zip clausage-windows.zip --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
